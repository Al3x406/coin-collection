<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Coin Collection{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            🪙 My Coin Collection
        </a>

        <div class="navbar-nav">

            <a class="nav-link" href="/">
                Home
            </a>

            <a class="nav-link" href="/coins">
                Collection
            </a>
<a class="nav-link" href="/sets">
                Sets
            </a>
<a class="nav-link" href="/artifacts">
                Cabinet
            </a>


            <a class="nav-link" href="/globe">
                Globe
            </a>

            <a
                class="nav-link"
                href="{{ url_for('collection_timeline') }}">
                Timeline
            </a>

            {% if is_owner %}
                <a class="nav-link" href="/add">
                    Add Coin
                </a>

                <a class="nav-link" href="{{ url_for('download_database') }}"
                   onclick="return confirm('Are you sure you want to download a backup of your coin database?');">
                    Download DB
                </a>

                <form
                    method="POST"
                    action="{{ url_for('owner_logout') }}"
                    class="d-flex">
                    <button
                        type="submit"
                        class="nav-link btn btn-link">
                        Owner Logout
                    </button>
                </form>
            {% else %}
                <a
                    class="nav-link"
                    href="{{ url_for('owner_login') }}">
                    Owner Login
                </a>
            {% endif %}

        </div>

    </div>
</nav>

<main class="container py-4">

    {% block content %}
    {% endblock %}

</main>

<!-- Loaded after page-level cabinet styles so decor overrides stay isolated
     to the cabinet page without disturbing the calibrated artifact layout. -->
<link rel="stylesheet" href="{{ url_for('static', filename='cabinet_variants.css') }}">

</body>

</html>
